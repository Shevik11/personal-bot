[project]
name = "telegram-bot"
version = "0.1.0"
description = "Telegram bot built with python-telegram-bot"
readme = "README.md"
authors = [
    { name = "Shevik11", email = "maksshevchuk621@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
]

[project.scripts]
telegram-bot = "telegram_bot:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
